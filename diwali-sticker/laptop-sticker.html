<script>
  const NS='http://www.w3.org/2000/svg';
  const rays=document.getElementById('raysAll');
  for(let i=0;i<36;i++){const p=document.createElementNS(NS,'path');p.setAttribute('d','M-4 -30 L0 -260 L4 -30 Z');p.setAttribute('transform',`rotate(${i*10})`);rays.appendChild(p);}
  // marigold toran straight across top of screen
  const toran=document.getElementById('toran');
  for(let i=0;i<=24;i++){
    const x=82+i*14.5, y=50+Math.sin(i/24*Math.PI*4)*3;
    const c=document.createElementNS(NS,'circle');
    c.setAttribute('cx',x);c.setAttribute('cy',y);c.setAttribute('r',5.6);
    c.setAttribute('fill',i%2?'#FFB300':'#FF6F00');c.setAttribute('stroke','#B34700');c.setAttribute('stroke-width','.9');
    toran.appendChild(c);
    if(i%3===1){const l=document.createElementNS(NS,'path');
      l.setAttribute('d',`M${x} ${y+5} q -4 8 0 14 q 4 -6 0 -14 Z`);l.setAttribute('fill','#2E7D32');l.setAttribute('stroke','#1B5E20');l.setAttribute('stroke-width','.7');toran.appendChild(l);}
  }
  // use a real photo if present
  window.photoReady = new Promise(res=>{
    const tryLoad=(names)=>{ if(!names.length) return res(false);
      const im=new Image(); im.onload=()=>{
        const ph=document.getElementById('photo'); ph.setAttribute('href',im.src); ph.style.display='';
        document.getElementById('artwork').style.display='none'; document.getElementById('raysAll').style.display='none'; res(true);
      }; im.onerror=()=>tryLoad(names.slice(1)); im.src=names[0]; };
    tryLoad(['laxmi-ganesh.jpg','laxmi-ganesh.jpeg','laxmi-ganesh.png','laxmi-ganesh.webp']);
  });
  const s=new URLSearchParams(location.search).get('s'); if(s) document.documentElement.style.setProperty('--s',s+'px');
</script>
